<title id='t'>Mean TTFT that each benchmark client reports at concurrency 256</title>
<desc id='d'>True TTFT 50.8 to 51.2 ms. evalscope perf 1.15.0: 140 ms before the fix, 67 ms with it; TensorRT-LLM benchmark_serving 178ec0b: 114 ms before the fix, 77 ms with it; InferenceX bench_serving 3370376: 99 ms before the fix, 72 ms with it; vllm bench serve 191e5d5: 87 ms before the fix, 63 ms with it; SGLang bench_serving 89386ea: 81 ms before the fix, 63 ms with it; aiperf 0.13.0: 55 ms; guidellm 0.8.1: 54 ms; inference-perf 0.7.0: 52 ms.</desc>
