[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bench-truth"
version = "0.1.0"
description = "A streaming server with known timings, to measure how accurate LLM serving benchmarks are"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9"]

[tool.hatch.build.targets.wheel]
packages = ["bench_truth"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "SIM", "RUF", "PGH"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
