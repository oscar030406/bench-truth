[package]
name = "bench-truth-server"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media", "Win32_System_Performance"] }

[profile.release]
codegen-units = 1
lto = true
