name: release

# A pull request that changes the server builds and tests every binary.
# A v* tag also publishes them as a GitHub release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [server-rs/**, .github/workflows/release.yml]

permissions:
  contents: read

jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, name: x86_64-linux }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: aarch64-linux }
          - { os: macos-15-intel, target: x86_64-apple-darwin, name: x86_64-macos }
          - { os: macos-15, target: aarch64-apple-darwin, name: aarch64-macos }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, name: x86_64-windows, exe: .exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, name: aarch64-windows, exe: .exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      BIN: server-rs/target/${{ matrix.target }}/release/bench-truth-server${{ matrix.exe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Build the server
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }} --manifest-path server-rs/Cargo.toml
      - name: Run the protocol tests against that binary
        run: BT_SERVER_BIN="$BIN" uv run --frozen pytest -q tests -k rust
      - name: Package
        run: |
          mkdir dist
          if [[ -n "${{ matrix.exe }}" ]]; then
            uv run --frozen python -m zipfile -c dist/bench-truth-server-${{ matrix.name }}.zip "$BIN"
          else
            tar -C "$(dirname "$BIN")" -czf dist/bench-truth-server-${{ matrix.name }}.tar.gz bench-truth-server
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: server
    runs-on: ubuntu-24.04
    # Only this job, which runs no build code, can write to the repository.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: awk -v h="## [${GITHUB_REF_NAME#v}]" 'index($0, h) == 1 {p = 1; next} index($0, "## [") == 1 {p = 0} p' CHANGELOG.md > notes.md
      - name: Check the tag against the versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # The tag must match both versions, and CHANGELOG.md must have its section.
          grep -qx "version = \"${GITHUB_REF_NAME#v}\"" server-rs/Cargo.toml
          grep -qx "version = \"${GITHUB_REF_NAME#v}\"" pyproject.toml
          test -s notes.md
      - name: Attest the build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Checksums
        run: cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done && cat *.sha256
      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "bench-truth $GITHUB_REF_NAME" --notes-file notes.md dist/*
