name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build a static server binary
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl --manifest-path server-rs/Cargo.toml
      - name: Run the protocol tests against that binary
        run: BT_SERVER_BIN=server-rs/target/x86_64-unknown-linux-musl/release/bench-truth-server uv run --frozen pytest -q tests -k rust
      - name: Package
        run: |
          mkdir dist
          tar -C server-rs/target/x86_64-unknown-linux-musl/release -czf dist/bench-truth-server-x86_64-linux.tar.gz bench-truth-server
          (cd dist && sha256sum bench-truth-server-x86_64-linux.tar.gz > bench-truth-server-x86_64-linux.tar.gz.sha256)
      - name: Release notes from CHANGELOG.md
        run: awk -v h="## [${GITHUB_REF_NAME#v}]" 'index($0, h) == 1 {p = 1; next} index($0, "## [") == 1 {p = 0} p' CHANGELOG.md > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "bench-truth $GITHUB_REF_NAME" --notes-file notes.md dist/*
